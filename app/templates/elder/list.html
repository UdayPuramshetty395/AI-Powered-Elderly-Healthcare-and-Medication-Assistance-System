{% extends "base.html" %}
{% block title %}Elder Profiles{% endblock %}
{% block page_title %}Elder Profiles{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <p class="text-muted mb-0">Manage elderly patient profiles</p>
        <small class="text-muted" id="elder-count"></small>
    </div>
    <a href="/elders/add" class="btn btn-primary">
        <i class="bi bi-person-plus me-2"></i>Add Elder
    </a>
</div>

<!-- Search Bar -->
<div class="search-bar mb-4" style="max-width:400px">
    <i class="bi bi-search search-icon"></i>
    <input type="text" class="form-control" id="elder-search" placeholder="Search elders by name...">
</div>

<!-- Elder Cards Grid -->
<div class="row g-4" id="elders-grid">
    <div class="col-12 text-center py-5">
        <div class="spinner-healthcare mx-auto"></div>
        <p class="mt-3 text-muted">Loading elder profiles...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/elder.js') }}"></script>
<script>document.body.dataset.page = 'elder-list';</script>
{% endblock %}
