<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elderly Healthcare System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <h3 class="text-center fw-800 mb-1">Welcome Back</h3>
        <p class="text-center text-muted mb-4">Sign in to your healthcare account</p>

        <form id="login-form" novalidate>
            <div class="mb-3">
                <label class="form-label" for="username">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0" id="username"
                           placeholder="Enter username or email" required autocomplete="username">
                    <div class="invalid-feedback"></div>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-end-0 border-start-0" id="password"
                           placeholder="Enter password" required autocomplete="current-password">
                    <button class="btn btn-light border toggle-password" type="button" data-target="#password">
                        <i class="bi bi-eye-slash"></i>
                    </button>
                    <div class="invalid-feedback"></div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-600">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>

        <div class="mt-4 p-3 rounded-3" style="background:#f0f9ff;border:1px solid #bae6fd">
            <small class="text-muted d-block text-center fw-600 mb-2">Demo Credentials</small>
            <small class="text-muted d-block">👤 Caretaker: <code>dr_radhika</code> / <code>Test@123</code></small>
            <small class="text-muted d-block">🔑 Admin: <code>admin</code> / <code>Test@123</code></small>
        </div>

        <p class="text-center mt-3 mb-0">
            Don't have an account? <a href="/register" class="text-primary fw-600">Register here</a>
        </p>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>document.addEventListener('DOMContentLoaded', () => redirectIfLoggedIn());</script>
</body>
</html>
