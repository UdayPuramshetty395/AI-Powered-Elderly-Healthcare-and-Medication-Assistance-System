{% extends "base.html" %}
{% block title %}Add Medicine{% endblock %}
{% block page_title %}Add Medicine{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
    <a href="/medicines" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
    <span class="text-muted">Back to Medicines</span>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card p-4">
            <h5 class="fw-700 mb-4"><i class="bi bi-capsule me-2 text-primary"></i>Add New Medicine</h5>
            <form id="add-medicine-form" novalidate>
                <!-- Elder Selection -->
                <div class="mb-4">
                    <label class="form-label">Select Elder *</label>
                    <select class="form-select" id="elder_id" required>
                        <option value="">Choose an elder...</option>
                    </select>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Medicine Name *</label>
                        <input type="text" class="form-control" id="name" placeholder="e.g., Metformin" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Generic Name</label>
                        <input type="text" class="form-control" id="generic_name" placeholder="Generic/chemical name">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Dosage *</label>
                        <input type="text" class="form-control" id="dosage" placeholder="e.g., 500mg" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Frequency *</label>
                        <select class="form-select" id="frequency" required>
                            <option value="">Select...</option>
                            <option>Once daily</option>
                            <option>Twice daily</option>
                            <option>Three times daily</option>
                            <option>Four times daily</option>
                            <option>Every 8 hours</option>
                            <option>Every 12 hours</option>
                            <option>As needed (PRN)</option>
                            <option>Once weekly</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Route *</label>
                        <select class="form-select" id="route" required>
                            <option value="oral">Oral</option>
                            <option value="injection">Injection</option>
                            <option value="topical">Topical</option>
                            <option value="inhalation">Inhalation</option>
                            <option value="sublingual">Sublingual</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Start Date</label>
                        <input type="date" class="form-control" id="start_date">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">End Date</label>
                        <input type="date" class="form-control" id="end_date">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Prescribed By</label>
                        <input type="text" class="form-control" id="prescribed_by" placeholder="Doctor's name">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Purpose</label>
                        <input type="text" class="form-control" id="purpose" placeholder="What is it for?">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Special Instructions</label>
                        <textarea class="form-control" id="instructions" rows="2"
                                  placeholder="e.g., Take with food, avoid grapefruit, take on empty stomach..."></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Side Effects to Watch</label>
                        <textarea class="form-control" id="side_effects" rows="2"
                                  placeholder="Known side effects to monitor..."></textarea>
                    </div>
                </div>
                <div class="d-flex gap-3 mt-4">
                    <button type="submit" class="btn btn-primary px-4" id="submit-btn">
                        <i class="bi bi-plus-lg me-2"></i>Add Medicine
                    </button>
                    <a href="/medicines" class="btn btn-outline-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/medicine.js') }}"></script>
{% endblock %}
